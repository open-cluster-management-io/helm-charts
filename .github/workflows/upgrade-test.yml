# Copyright Contributors to the Open Cluster Management project
#
# Upgrade and downgrade test for OCM (open-cluster-management-io/ocm#1732).
# release (N-1) -> ocm main (N) -> release (N-1), once with Helm charts and once with clusteradm.
# Runs nightly and on demand, not on pull requests.
name: Upgrade Test

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'OCM release to install first and downgrade to, e.g. 1.4.0. Empty means the latest OCM release.'
        required: false
        type: string

permissions:
  contents: read

env:
  KIND_VERSION: v0.31.0
  KIND_NODE_IMAGE: kindest/node:v1.29.2
  KUBECTL_VERSION: v1.29.2
  HELM_VERSION: v3.22.0

jobs:
  upgrade:
    name: upgrade (${{ matrix.flow }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flow: [helm, clusteradm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          release=${INPUT_RELEASE:-$(gh release view --repo open-cluster-management-io/ocm --json tagName -q .tagName)}
          echo "RELEASE=${release#v}" >> "$GITHUB_ENV"
          echo "Release: ${release#v}"

      - name: Install kind, kubectl and helm
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/bin" --strip-components=1 linux-amd64/helm
          chmod +x "$HOME/bin/kind" "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download release charts
        if: matrix.flow == 'helm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${RELEASE}" --repo open-cluster-management-io/ocm -D "$RUNNER_TEMP/release-charts" \
            --pattern "cluster-manager-${RELEASE}.tgz" --pattern "klusterlet-${RELEASE}.tgz"

      - name: Checkout ocm main charts
        if: matrix.flow == 'helm'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-cluster-management-io/ocm
          ref: main
          path: ocm
          sparse-checkout: |
            deploy/cluster-manager/chart
            deploy/klusterlet/chart

      - name: Install clusteradm
        if: matrix.flow == 'clusteradm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${RELEASE}" --repo open-cluster-management-io/clusteradm \
            --pattern clusteradm_linux_amd64.tar.gz -O - | tar -xz -C "$HOME/bin" clusteradm

      - name: Run ${{ matrix.flow }} flow
        env:
          RELEASE_CHARTS: ${{ runner.temp }}/release-charts
          MAIN_CHARTS: ${{ github.workspace }}/ocm
          WORK_DIR: ${{ runner.temp }}
        run: |
          if [ -d ocm ]; then echo "ocm main: $(git -C ocm rev-parse --short HEAD)"; fi
          test/upgrade/${{ matrix.flow }}.sh

      - name: Collect cluster state
        if: failure()
        run: test/upgrade/collect.sh "$RUNNER_TEMP/upgrade-test-${{ matrix.flow }}"

      - name: Upload cluster state
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-test-${{ matrix.flow }}
          path: ${{ runner.temp }}/upgrade-test-${{ matrix.flow }}
